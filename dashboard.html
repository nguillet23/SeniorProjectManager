<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Design Project Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Senior Design Project Manager</h1>
    <button onclick="openModal()">+ Create Ticket</button>
    <button onclick="logout()" style="float: right;">Logout</button>
</header>

<main class="board">

    <section class="column" id="todo">
        <h2>To Do</h2>
        <div class="tickets"></div>
    </section>

    <section class="column" id="progress">
        <h2>In Progress</h2>
        <div class="tickets"></div>
    </section>

    <section class="column" id="done">
        <h2>Done</h2>
        <div class="tickets"></div>
    </section>

</main>

<div class="modal" id="modal">

    <div class="modal-content">

        <h2>Create Ticket</h2>

        <input id="title" placeholder="Ticket title">

        <textarea id="description" placeholder="Description"></textarea>

        <input id="assigned_to" placeholder="Assigned to">

        <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <label>Deadline</label>
        <input id="deadline" type="date">

        <button onclick="createTicket()">Create</button>
        <button onclick="closeModal()">Cancel</button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
